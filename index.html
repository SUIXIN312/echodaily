  <div class="app">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#today" data-nav="today" aria-label="EchoDaily 首页">
        <span class="brand-mark">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <circle cx="22" cy="22" r="20.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M11 22h3l2.5-7 3.5 15 3-11 2.5 6h7.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>EchoDaily</strong>
          <small>回声英语</small>
        </span>
      </a>

      <nav class="side-nav">
        <a href="#today" data-nav="today" class="side-link">
          <svg><use href="#i-sun"/></svg><span>今日训练</span><em id="side-today-dot" class="side-dot"></em>
        </a>
        <a href="#library" data-nav="library" class="side-link">
          <svg><use href="#i-library"/></svg><span>听力库</span><em id="side-library-count">5</em>
        </a>
        <a href="#progress" data-nav="progress" class="side-link">
          <svg><use href="#i-chart"/></svg><span>学习记录</span>
        </a>
        <a href="#settings" data-nav="settings" class="side-link">
          <svg><use href="#i-settings"/></svg><span>设置</span>
        </a>
      </nav>

      <div class="side-divider"></div>

      <div class="side-streak" id="side-streak">
        <div class="side-streak-head"><span>连续学习</span><svg><use href="#i-spark"/></svg></div>
        <div class="side-streak-num"><strong id="side-streak-num">0</strong><span>天</span></div>
        <p id="side-streak-copy">今天听 25 分钟，点亮第一天。</p>
        <div class="mini-week" id="mini-week" aria-label="最近七天学习情况"></div>
      </div>

      <div class="side-note">
        <span class="eyebrow">DAILY ROUTINE</span>
        <p>盲听 → 精听<br>跟读 → 复述 → 复盘</p>
        <a href="#today" data-action="start-focus" class="side-note-link">开始 25 分钟 <svg><use href="#i-arrow"/></svg></a>
      </div>

      <div class="side-foot">
        <span>CNN 10 · 真实新闻</span>
        <span>个人学习用途</span>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu" id="mobile-menu" aria-label="打开菜单">
            <svg><use href="#i-menu"/></svg>
          </button>
          <div>
            <div class="topbar-date" id="topbar-date">10月31日 · 星期六</div>
            <div class="topbar-sub" id="topbar-sub">你的每日国际新闻听力</div>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" data-action="open-search" aria-label="搜索听力库"><svg><use href="#i-search"/></svg></button>
          <a class="icon-btn" href="#settings" data-nav="settings" aria-label="设置"><svg><use href="#i-settings"/></svg></a>
          <div class="avatar" title="本地学习者">L</div>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <nav class="mobile-nav" aria-label="移动端导航">
      <a href="#today" data-nav="today"><svg><use href="#i-sun"/></svg><span>今日</span></a>
      <a href="#library" data-nav="library"><svg><use href="#i-library"/></svg><span>听力库</span></a>
      <a href="#progress" data-nav="progress"><svg><use href="#i-chart"/></svg><span>记录</span></a>
      <a href="#settings" data-nav="settings"><svg><use href="#i-settings"/></svg><span>设置</span></a>
    </nav>
  </div>

  <div class="focus-layer" id="focus-layer" hidden aria-modal="true" role="dialog" aria-label="25 分钟引导训练">
    <div class="focus-card">
      <header class="focus-head">
        <div>
          <span class="eyebrow">GUIDED SESSION</span>
          <h2>25 分钟听力训练</h2>
        </div>
        <div class="focus-head-right">
          <div class="focus-total"><span id="focus-total-time">25:00</span><small>总计时</small></div>
          <button class="icon-btn" data-action="close-focus" aria-label="关闭训练"><svg><use href="#i-close"/></svg></button>
        </div>
      </header>
      <div class="focus-progress"><span id="focus-progress-bar"></span></div>
      <div class="focus-body">
        <aside class="focus-steps" id="focus-steps"></aside>
        <section class="focus-main" id="focus-main"></section>
      </div>
      <footer class="focus-foot">
        <button class="btn btn-ghost" data-action="focus-prev">上一步</button>
        <div class="focus-hint" id="focus-hint">按自己的节奏来，完成一步算一步。</div>
        <button class="btn btn-primary" data-action="focus-next">完成本步 <svg><use href="#i-arrow"/></svg></button>
      </footer>
    </div>
  </div>

  <div class="modal-layer" id="modal-layer" hidden>
    <div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
