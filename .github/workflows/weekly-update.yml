name: Weekly EchoDaily update

on:
  schedule:
    # Saturday 09:00 Asia/Shanghai (01:00 UTC)
    - cron: '0 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-echodaily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the next five-episode pack
        env:
          DEEPSEEK_API_KEY: ${{ secrets.ENGLISHLISTENNING }}
        run: python tools/weekly_update.py --limit 5

      - name: Commit and push if content changed
        run: |
          git config user.name "EchoDaily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js assets/subtitles.js
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          git commit -m "Weekly update: $(date -u +%Y-%m-%d)"
          git push
