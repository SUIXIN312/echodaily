/* ============================================================
   EchoDaily · 回声英语
   Editorial listening workspace — warm paper, ink, vermilion.
   ============================================================ */

:root {
  --bg: #f1ece0;
  --bg-deep: #e7dfcf;
  --surface: #fbf8f1;
  --surface-2: #f5efe3;
  --surface-3: #efe7d8;
  --ink: #191813;
  --ink-2: #3c382f;
  --muted: #776f60;
  --faint: #a79d89;
  --line: #ddd3c0;
  --line-strong: #c8bba3;
  --accent: #d24b2b;
  --accent-deep: #a9361c;
  --accent-soft: #f5ded4;
  --green: #1d5948;
  --green-soft: #dce9e2;
  --gold: #b58a3f;
  --gold-soft: #f1e5ca;
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow: 0 22px 55px -28px rgba(54, 41, 20, 0.42);
  --shadow-soft: 0 8px 24px -16px rgba(54, 41, 20, 0.35);
  --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", "Songti SC", "Noto Serif SC", "STSong", serif;
  --font-ui: "Avenir Next", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "SFMono-Regular", "Cascadia Mono", "Consolas", "Liberation Mono", monospace;
  --sidebar-w: 250px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { overflow-x: hidden; }
body {
  margin: 0;
  min-width: 320px;
  background-color: var(--bg);
  background-image:
    radial-gradient(900px 600px at 12% -5%, rgba(255, 252, 242, 0.85), transparent 62%),
    radial-gradient(700px 500px at 92% 8%, rgba(210, 75, 43, 0.055), transparent 60%),
    radial-gradient(600px 500px at 60% 100%, rgba(29, 89, 72, 0.05), transparent 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
::selection { background: var(--accent); color: #fff; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg { width: 20px; height: 20px; fill: currentColor; display: block; }
.svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }

.eyebrow {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ============================== Layout ============================== */
.app { min-height: 100vh; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  z-index: 40;
  display: flex;
  flex-direction: column;
  padding: 26px 18px 20px;
  border-right: 1px solid var(--line);
  background: rgba(247, 242, 232, 0.78);
  backdrop-filter: blur(18px) saturate(1.05);
  -webkit-backdrop-filter: blur(18px) saturate(1.05);
}
.shell { margin-left: var(--sidebar-w); min-height: 100vh; }
.view {
  width: 100%;
  max-width: 1390px;
  margin: 0 auto;
  padding: 30px 38px 100px;
  outline: none;
}

.brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 0; }
.brand-mark { width: 40px; height: 40px; color: var(--ink); flex: 0 0 auto; }
.brand-mark svg { width: 100%; height: 100%; fill: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.02; }
.brand-text strong {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.025em;
}
.brand-text small {
  margin-top: 4px;
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--muted);
}
.side-nav { margin-top: 36px; display: flex; flex-direction: column; gap: 4px; }
.side-link {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  height: 44px;
  padding: 0 11px;
  border-radius: 11px;
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 500;
  transition: background 0.2s var(--ease), color 0.2s;
}
.side-link svg { width: 18px; height: 18px; color: var(--muted); transition: color 0.2s; }
.side-link:hover { background: rgba(255, 253, 246, 0.75); }
.side-link.active { background: var(--ink); color: #fbf7ee; box-shadow: var(--shadow-soft); }
.side-link.active svg { color: #fbf7ee; }
.side-link em {
  margin-left: auto;
  font-style: normal;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--faint);
}
.side-link.active em { color: rgba(251, 247, 238, 0.6); }
.side-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.side-link.active .side-dot { background: #ffb59d; box-shadow: 0 0 0 3px rgba(255, 181, 157, 0.18); }
.side-divider { height: 1px; background: var(--line); margin: 24px 8px 18px; }
.side-streak { padding: 16px 14px 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255, 252, 245, 0.55); }
.side-streak-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.side-streak-head svg { width: 14px; height: 14px; color: var(--gold); }
.side-streak-num { display: flex; align-items: baseline; gap: 5px; margin-top: 4px; }
.side-streak-num strong { font-family: var(--font-display); font-size: 37px; line-height: 1; font-weight: 500; letter-spacing: -0.04em; }
.side-streak-num span { font-size: 12px; color: var(--muted); }
.side-streak p { margin: 7px 0 11px; font-size: 11px; line-height: 1.6; color: var(--muted); }
.mini-week { display: flex; gap: 4px; }
.mini-week i { flex: 1; height: 5px; border-radius: 4px; background: var(--bg-deep); }
.mini-week i.on { background: var(--accent); }
.mini-week i.partial { background: #e5a28d; }
.side-note { margin-top: auto; padding: 18px 10px 16px; }
.side-note p { font-family: var(--font-display); font-size: 19px; line-height: 1.35; margin: 7px 0 11px; color: var(--ink-2); }
.side-note-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--accent); }
.side-note-link svg { width: 14px; height: 14px; transition: transform 0.2s; }
.side-note-link:hover svg { transform: translateX(3px); }
.side-foot { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; color: var(--faint); }

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 38px;
  border-bottom: 1px solid transparent;
  background: linear-gradient(to bottom, rgba(241, 236, 224, 0.94), rgba(241, 236, 224, 0.72));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-date { font-family: var(--font-display); font-size: 18px; letter-spacing: -0.01em; }
.topbar-sub { margin-top: 2px; font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 38px;
  height: 38px;
  display: inline-grid;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
  transition: background 0.2s, border-color 0.2s, transform 0.2s;
}
.icon-btn:hover { background: rgba(255, 252, 245, 0.8); border-color: var(--line); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 18px; height: 18px; }
.avatar {
  width: 34px; height: 34px; margin-left: 4px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--ink);
  color: #f8f1e3;
  font-family: var(--font-display);
  font-size: 15px;
}
.mobile-menu { display: none; }

/* ============================== Shared bits ============================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 43px;
  padding: 0 17px;
  border: 1px solid transparent;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  transition: transform 0.2s var(--ease), background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.btn svg { width: 16px; height: 16px; }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn-primary { background: var(--accent); color: #fff9f2; box-shadow: 0 8px 22px -12px rgba(210, 75, 43, 0.9); }
.btn-primary:hover { background: var(--accent-deep); box-shadow: 0 10px 28px -12px rgba(210, 75, 43, 0.9); }
.btn-ghost { border-color: var(--line); background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--line-strong); }
.btn-soft { background: var(--surface-3); color: var(--ink-2); }
.btn-soft:hover { background: var(--bg-deep); }
.btn-dark { background: var(--ink); color: #fbf7ee; }
.btn-dark:hover { background: #2b2922; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 11.5px; border-radius: 9px; }
.btn-sm svg { width: 14px; height: 14px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.text-link { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); font-weight: 600; font-size: 12px; }
.text-link svg { width: 14px; height: 14px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 25px;
  padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 252, 245, 0.45);
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.chip.accent { border-color: rgba(210, 75, 43, 0.22); background: var(--accent-soft); color: var(--accent-deep); }
.chip.green { border-color: rgba(29, 89, 72, 0.18); background: var(--green-soft); color: var(--green); }
.chip.gold { border-color: rgba(181, 138, 63, 0.22); background: var(--gold-soft); color: #7e5c1f; }
.card {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.55) inset;
}
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 34px 0 16px; }
.section-head h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 27px; letter-spacing: -0.025em; }
.section-head p { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); }
.divider { height: 1px; background: var(--line); }

/* ============================== Hero ============================== */
.hero {
  --hero-a: #251510;
  --hero-b: #7d2e1b;
  --hero-glow: #ff8a5c;
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: minmax(0, 1.42fr) minmax(250px, 0.58fr);
  min-height: 360px;
  overflow: hidden;
  border-radius: var(--radius-xl);
  background:
    radial-gradient(700px 420px at 88% 4%, color-mix(in srgb, var(--hero-glow) 42%, transparent), transparent 60%),
    linear-gradient(125deg, var(--hero-a) 8%, var(--hero-b) 100%);
  color: #fbf5e8;
  box-shadow: 0 30px 70px -40px rgba(35, 25, 12, 0.7);
}
.hero[data-theme="steel"] { --hero-a: #121b21; --hero-b: #315360; --hero-glow: #7bc3d6; }
.hero[data-theme="forest"] { --hero-a: #101d17; --hero-b: #276047; --hero-glow: #8fd0a9; }
.hero[data-theme="ocean"] { --hero-a: #0d1925; --hero-b: #1e5472; --hero-glow: #7fc3e4; }
.hero[data-theme="violet"] { --hero-a: #1a1423; --hero-b: #4a3169; --hero-glow: #c7a3ef; }
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
  background-size: 52px 52px;
  mask-image: linear-gradient(to right, transparent 35%, #000 100%);
}
.hero-copy {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 34px 38px 32px;
}
.hero-topline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hero-kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.19em; color: rgba(251, 245, 232, 0.62); }
.hero-kicker b { color: var(--hero-glow); font-weight: 600; }
.hero-live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; color: rgba(251, 245, 232, 0.72); }
.hero-live i { width: 5px; height: 5px; border-radius: 50%; background: var(--hero-glow); box-shadow: 0 0 0 4px color-mix(in srgb, var(--hero-glow) 18%, transparent); animation: pulse 2.6s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.hero h1 {
  max-width: 780px;
  margin: 28px 0 0;
  font-family: var(--font-display);
  font-size: clamp(43px, 5.1vw, 72px);
  font-weight: 500;
  line-height: 0.96;
  letter-spacing: -0.038em;
  text-wrap: balance;
  overflow-wrap: break-word;
}
.hero h1 em { font-style: italic; color: var(--hero-glow); }
.hero-zh {
  margin: 13px 0 0;
  font-family: var(--font-display);
  font-size: clamp(17px, 1.6vw, 21px);
  letter-spacing: 0.02em;
  color: rgba(251, 245, 232, 0.8);
}
.hero-deck {
  max-width: 620px;
  margin: 16px 0 0;
  font-size: 12.5px;
  line-height: 1.65;
  color: rgba(251, 245, 232, 0.62);
}
.hero-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 22px; }
.hero-meta span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 27px;
  padding: 0 10px;
  border: 1px solid rgba(251, 245, 232, 0.18);
  border-radius: 999px;
  background: rgba(251, 245, 232, 0.06);
  color: rgba(251, 245, 232, 0.82);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.03em;
}
.hero-meta svg { width: 12px; height: 12px; opacity: 0.7; }
.hero-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: auto; padding-top: 25px; }
.hero-actions .btn-primary { background: var(--hero-glow); color: #24130c; box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--hero-glow) 70%, transparent); }
.hero-actions .btn-primary:hover { background: #fff; }
.hero-actions .btn-ghost { border-color: rgba(251, 245, 232, 0.22); color: #fbf5e8; }
.hero-actions .btn-ghost:hover { background: rgba(251, 245, 232, 0.09); border-color: rgba(251, 245, 232, 0.36); }
.hero-progress { min-width: 170px; }
.hero-progress-bar { height: 4px; border-radius: 4px; background: rgba(251, 245, 232, 0.16); overflow: hidden; }
.hero-progress-bar span { display: block; height: 100%; border-radius: 4px; background: var(--hero-glow); transition: width 0.5s var(--ease); }
.hero-progress p { margin: 6px 0 0; font-size: 10px; color: rgba(251, 245, 232, 0.55); letter-spacing: 0.03em; }
.hero-art { position: relative; z-index: 1; min-height: 300px; }
.hero-art .issue-no {
  position: absolute;
  right: 20px;
  bottom: 12px;
  font-family: var(--font-display);
  font-size: clamp(150px, 18vw, 252px);
  line-height: 0.72;
  letter-spacing: -0.08em;
  color: rgba(251, 245, 232, 0.1);
  user-select: none;
}
.hero-art .orbit {
  position: absolute;
  border: 1px solid rgba(251, 245, 232, 0.18);
  border-radius: 50%;
}
.hero-art .orbit.o1 { width: 290px; height: 290px; right: 3%; top: 12%; }
.hero-art .orbit.o2 { width: 205px; height: 205px; right: 11%; top: 25%; border-style: dashed; opacity: 0.6; }
.hero-art .orbit.o3 { width: 112px; height: 112px; right: 27%; top: 40%; background: color-mix(in srgb, var(--hero-glow) 16%, transparent); }
.hero-art .wave {
  position: absolute;
  left: 14%;
  top: 40%;
  width: 66%;
  height: 100px;
  display: flex;
  align-items: center;
  gap: 5px;
  transform: rotate(-7deg);
  opacity: 0.85;
}
.hero-art .wave i { flex: 1; min-width: 2px; border-radius: 4px; background: var(--hero-glow); opacity: 0.55; }
.hero-art .stamp {
  position: absolute;
  left: 3%;
  top: 13%;
  width: 84px;
  height: 84px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(251, 245, 232, 0.26);
  border-radius: 50%;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.12em;
  line-height: 1.5;
  text-align: center;
  color: rgba(251, 245, 232, 0.6);
  transform: rotate(-11deg);
}
.hero-art .side-label {
  position: absolute;
  right: 18px;
  top: 20px;
  writing-mode: vertical-rl;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.24em;
  color: rgba(251, 245, 232, 0.45);
}

/* ============================== Today layout ============================== */
.today-grid { display: grid; grid-template-columns: minmax(0, 1fr) 326px; gap: 24px; align-items: start; margin-top: 24px; }
.rail { position: sticky; top: 94px; display: flex; flex-direction: column; gap: 18px; }
.rail-card { padding: 20px; }
.rail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.rail-head h3 { margin: 4px 0 0; font-family: var(--font-display); font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.rail-head p { margin: 5px 0 0; font-size: 11px; color: var(--muted); line-height: 1.5; }
.ring {
  --p: 0;
  position: relative;
  width: 74px;
  height: 74px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--bg-deep) 0);
  transition: background 0.5s var(--ease);
}
.ring::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--surface); }
.ring span { position: relative; z-index: 1; font-family: var(--font-display); font-size: 17px; }
.ring span small { font-family: var(--font-ui); font-size: 8px; color: var(--muted); }
.task-list { list-style: none; margin: 17px 0 0; padding: 0; display: flex; flex-direction: column; }
.task-item {
  display: grid;
  grid-template-columns: 27px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  cursor: pointer;
  transition: opacity 0.2s;
}
.task-item:first-child { border-top: 0; padding-top: 4px; }
.task-check {
  width: 21px; height: 21px;
  display: grid; place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: transparent;
  color: transparent;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.task-check svg { width: 11px; height: 11px; }
.task-item.done .task-check { background: var(--green); border-color: var(--green); color: #fff; }
.task-item.done .task-name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.task-name { font-size: 12px; font-weight: 600; line-height: 1.35; }
.task-sub { display: block; margin-top: 2px; font-size: 9.5px; font-weight: 400; color: var(--muted); }
.task-min { font-family: var(--font-mono); font-size: 9px; color: var(--faint); }
.rail-cta { margin-top: 8px; width: 100%; }
.streak-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 10.5px; color: var(--muted); }
.streak-line strong { color: var(--ink); font-size: 12px; }
.streak-line svg { width: 14px; height: 14px; color: var(--accent); }
.quote-card {
  position: relative;
  overflow: hidden;
  padding: 22px;
  background: var(--ink);
  color: #f8f1e3;
  border-radius: var(--radius-lg);
}
.quote-card::after {
  content: "“";
  position: absolute;
  right: 10px;
  top: -30px;
  font-family: var(--font-display);
  font-size: 150px;
  line-height: 1;
  color: rgba(248, 241, 227, 0.08);
}
.quote-card .eyebrow { color: rgba(248, 241, 227, 0.45); }
.quote-card blockquote { margin: 11px 0 10px; font-family: var(--font-display); font-size: 18px; line-height: 1.45; letter-spacing: -0.01em; }
.quote-card p { margin: 0; font-size: 11.5px; line-height: 1.65; color: rgba(248, 241, 227, 0.55); }
.quote-card .quote-source { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(248, 241, 227, 0.14); font-family: var(--font-mono); font-size: 9px; color: rgba(248, 241, 227, 0.5); }
.week-list { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; }
.week-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 10.5px; }
.week-row:first-child { border-top: 0; }
.week-row i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
.week-row.on i { background: var(--green); }
.week-row span { color: var(--muted); }
.week-row b { margin-left: auto; font-weight: 500; color: var(--ink-2); }

/* ============================== Workspace ============================== */
.workspace { overflow: hidden; border-radius: var(--radius-lg); scroll-margin-top: 92px; }
.workspace-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: rgba(251, 248, 241, 0.7);
}
.workspace-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
.workspace-title .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
.workspace-title strong { font-size: 12px; font-weight: 600; white-space: nowrap; }
.workspace-title span { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.workspace-tools { display: flex; align-items: center; gap: 6px; }
.seg {
  display: inline-flex;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface-2);
}
.seg button {
  min-width: 34px;
  height: 24px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 600;
  transition: background 0.15s, color 0.15s;
}
.seg button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(40, 30, 15, 0.09); }
.workspace-body { display: grid; grid-template-columns: minmax(0, 1.06fr) minmax(0, 0.94fr); }
.player-col { min-width: 0; padding: 16px; border-right: 1px solid var(--line); }
.transcript-col { min-width: 0; display: flex; flex-direction: column; background: rgba(255, 253, 247, 0.42); }

.player-shell {
  position: relative;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 14px;
  background: #0b0a08;
  color: #fff;
  isolation: isolate;
}
.player-shell video { width: 100%; height: 100%; display: block; object-fit: contain; background: #0b0a08; }
.player-shell .audio-visual {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  background:
    radial-gradient(360px 240px at 50% 40%, rgba(210, 75, 43, 0.28), transparent 70%),
    linear-gradient(145deg, #17130f, #2b2119);
}
.player-shell.audio-mode video { opacity: 0; }
.player-shell.audio-mode .audio-visual { display: flex; }
.audio-visual .audio-disc {
  width: 118px; height: 118px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: repeating-radial-gradient(circle at center, rgba(255,255,255,0.06) 0 1px, transparent 1px 5px);
  animation: spin 14s linear infinite;
  animation-play-state: paused;
}
.player-shell.playing .audio-disc { animation-play-state: running; }
@keyframes spin { to { transform: rotate(360deg); } }
.audio-disc::after { content: ""; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(210, 75, 43, 0.15); }
.audio-visual .audio-bars { display: flex; align-items: center; gap: 4px; height: 34px; }
.audio-visual .audio-bars i { width: 3px; border-radius: 3px; background: rgba(255, 249, 239, 0.65); animation: bars 1s ease-in-out infinite alternate; animation-play-state: paused; }
.player-shell.playing .audio-bars i { animation-play-state: running; }
@keyframes bars { from { height: 6px; } to { height: 28px; } }
.audio-visual small { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.2em; color: rgba(255, 249, 239, 0.4); }

.player-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 3;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 12px;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(0, 0, 0, 0.48), transparent);
}
.player-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 23px;
  padding: 0 8px;
  border-radius: 6px;
  background: rgba(8, 7, 6, 0.55);
  backdrop-filter: blur(8px);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.1em;
  color: rgba(255, 250, 241, 0.86);
}
.player-badge i { width: 5px; height: 5px; border-radius: 50%; background: #7fd6a7; }
.player-mode-toggle {
  pointer-events: auto;
  display: inline-flex;
  padding: 2px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 7px;
  background: rgba(8, 7, 6, 0.5);
  backdrop-filter: blur(8px);
}
.player-mode-toggle button {
  height: 21px;
  padding: 0 8px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: rgba(255, 250, 241, 0.6);
  font-size: 8px;
  font-weight: 600;
}
.player-mode-toggle button.active { background: rgba(255, 250, 241, 0.92); color: #181510; }

.subtitle-overlay {
  position: absolute;
  left: 14px; right: 14px; bottom: 60px;
  z-index: 2;
  text-align: center;
  pointer-events: none;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
}
.subtitle-overlay p { margin: 0 auto; max-width: 96%; }
.subtitle-overlay .sub-en {
  font-size: 12.5px;
  line-height: 1.38;
  font-weight: 600;
  color: #fffdf7;
  background: rgba(8, 7, 6, 0.52);
  display: inline;
  padding: 2px 6px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.subtitle-overlay .sub-zh {
  margin-top: 4px;
  font-size: 10.5px;
  line-height: 1.45;
  color: rgba(255, 247, 232, 0.88);
  background: rgba(8, 7, 6, 0.45);
  display: inline;
  padding: 2px 6px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.subtitle-overlay.sub-none,
.subtitle-overlay.sub-hidden { display: none; }
.subtitle-overlay.sub-en .sub-zh,
.subtitle-overlay.sub-zh .sub-en { display: none; }
.player-shell.no-sub .subtitle-overlay { display: none; }

.player-center {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.big-play {
  pointer-events: auto;
  width: 58px; height: 58px;
  display: grid; place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 50%;
  background: rgba(10, 9, 7, 0.42);
  backdrop-filter: blur(8px);
  color: #fff;
  transition: transform 0.2s, background 0.2s, opacity 0.2s;
}
.big-play svg { width: 21px; height: 21px; margin-left: 2px; }
.big-play:hover { transform: scale(1.06); background: var(--accent); border-color: var(--accent); }
.player-shell.playing .big-play { opacity: 0; transform: scale(0.85); pointer-events: none; }
.player-shell.loading .big-play { opacity: 0.4; }

.control-bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 4;
  padding: 26px 12px 10px;
  background: linear-gradient(to top, rgba(5, 4, 3, 0.9), rgba(5, 4, 3, 0.35) 65%, transparent);
}
.seek-row { display: flex; align-items: center; gap: 9px; }
.time-code { font-family: var(--font-mono); font-size: 8px; color: rgba(255, 250, 241, 0.65); min-width: 30px; }
.time-code.dur { text-align: right; }
input[type="range"].seek {
  --p: 0;
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 16px;
  background: transparent;
  cursor: pointer;
}
input[type="range"].seek::-webkit-slider-runnable-track {
  height: 3px;
  border-radius: 3px;
  background: linear-gradient(to right, #ff8f6d var(--p), rgba(255, 255, 255, 0.24) var(--p));
}
input[type="range"].seek::-moz-range-track { height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.24); }
input[type="range"].seek::-moz-range-progress { height: 3px; border-radius: 3px; background: #ff8f6d; }
input[type="range"].seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 9px; height: 9px;
  margin-top: -3px;
  border: 0;
  border-radius: 50%;
  background: #fff7ed;
  box-shadow: 0 0 0 3px rgba(255, 143, 109, 0.24);
}
input[type="range"].seek::-moz-range-thumb { width: 9px; height: 9px; border: 0; border-radius: 50%; background: #fff7ed; }
.control-row { display: flex; align-items: center; gap: 2px; margin-top: 4px; }
.ctrl {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: rgba(255, 250, 241, 0.78);
  transition: background 0.15s, color 0.15s;
}
.ctrl:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
.ctrl svg { width: 15px; height: 15px; }
.ctrl.on { color: #ff9a79; background: rgba(255, 143, 109, 0.14); }
.ctrl-spacer { flex: 1; }
.speed-pill {
  min-width: 36px;
  height: 24px;
  padding: 0 6px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 6px;
  background: transparent;
  color: rgba(255, 250, 241, 0.78);
  font-family: var(--font-mono);
  font-size: 8px;
}
.speed-pill:hover { background: rgba(255, 255, 255, 0.1); }
.clip-tag {
  position: absolute;
  left: 12px;
  top: 45px;
  z-index: 3;
  padding: 3px 7px;
  border-radius: 4px;
  background: rgba(8, 7, 6, 0.42);
  font-family: var(--font-mono);
  font-size: 7.5px;
  letter-spacing: 0.08em;
  color: rgba(255, 250, 241, 0.6);
}

.player-caption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 2px 2px;
}
.player-caption p { margin: 0; font-size: 10px; color: var(--muted); line-height: 1.5; }
.player-caption p strong { color: var(--ink-2); font-weight: 600; }
.player-caption .mini-actions { display: flex; gap: 5px; flex: 0 0 auto; }
.round-btn {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.round-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line-strong); }
.round-btn.on { background: var(--accent-soft); color: var(--accent-deep); border-color: rgba(210, 75, 43, 0.25); }
.round-btn svg { width: 14px; height: 14px; }
.clip-map { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.clip-map-head { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: 7.5px; color: var(--faint); letter-spacing: 0.06em; }
.clip-map-head .eyebrow { font-size: 8px; }
.clip-chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 10px;
  padding: 7px 8px;
  margin-top: 3px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  text-align: left;
  font-size: 9.5px;
  transition: background 0.15s, color 0.15s;
}
.clip-chip:hover { background: var(--surface-2); color: var(--ink); }
.clip-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clip-chip b { font-family: var(--font-mono); font-size: 7.5px; font-weight: 400; color: var(--faint); }

.transcript-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px 10px;
}
.tabs { display: flex; gap: 3px; }
.tab {
  position: relative;
  height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 600;
  transition: background 0.15s, color 0.15s;
}
.tab:hover { color: var(--ink); }
.tab.active { background: var(--ink); color: #fbf7ee; }
.tab .count { margin-left: 4px; font-family: var(--font-mono); font-size: 8px; opacity: 0.6; }
.transcript-tools { display: flex; align-items: center; gap: 2px; }
.tool-btn {
  width: 27px; height: 27px;
  display: grid; place-items: center;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
}
.tool-btn:hover { background: var(--surface-2); color: var(--ink); }
.tool-btn svg { width: 14px; height: 14px; }
.transcript-scroll {
  position: relative;
  flex: 1;
  max-height: 472px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 8px 18px 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.transcript-scroll::-webkit-scrollbar { width: 7px; }
.transcript-scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; border: 2px solid var(--surface); }
.t-section {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px 10px 6px;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.12em;
  color: var(--faint);
  text-transform: uppercase;
}
.t-section::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.t-item {
  position: relative;
  display: grid;
  grid-template-columns: 23px minmax(0, 1fr) 22px;
  gap: 7px;
  align-items: start;
  padding: 9px 8px 10px;
  border-left: 2px solid transparent;
  border-radius: 0 9px 9px 0;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.t-item:hover { background: rgba(239, 231, 216, 0.55); }
.t-item.active { background: rgba(245, 222, 212, 0.62); border-left-color: var(--accent); }
.t-index {
  padding-top: 1px;
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--faint);
  text-align: right;
}
.t-item.active .t-index { color: var(--accent); }
.t-en { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); letter-spacing: -0.005em; }
.t-item.active .t-en { color: var(--ink); }
.t-zh { margin: 4px 0 0; font-size: 11.5px; line-height: 1.65; color: var(--muted); }
.t-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-family: var(--font-mono); font-size: 7.5px; color: var(--faint); }
.t-star {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--faint);
  opacity: 0;
  transition: opacity 0.15s, color 0.15s;
}
.t-item:hover .t-star, .t-item.mastered .t-star { opacity: 1; }
.t-star svg { width: 13px; height: 13px; }
.t-item.mastered .t-star { color: var(--gold); }
.t-item.mastered .t-star svg { fill: var(--gold-soft); }
.sub-en .t-zh { display: none; }
.sub-zh .t-en { display: none; }
.sub-none .t-en, .sub-none .t-zh { display: none; }
.sub-none .t-item { padding-top: 12px; padding-bottom: 12px; }
.transcript-empty { padding: 30px 20px; text-align: center; color: var(--muted); font-size: 11px; line-height: 1.7; }

/* tab panels */
.panel-scroll { max-height: 472px; overflow-y: auto; padding: 4px 14px 22px; }
.vocab-grid { display: flex; flex-direction: column; gap: 8px; }
.vocab-card {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: rgba(255, 253, 247, 0.55);
}
.vocab-top { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.vocab-word { font-family: var(--font-display); font-size: 19px; letter-spacing: -0.01em; }
.vocab-phonetic { font-family: var(--font-mono); font-size: 8.5px; color: var(--faint); }
.vocab-pos { font-size: 8px; font-style: italic; color: var(--accent); }
.vocab-zh { margin-left: auto; font-size: 10.5px; color: var(--ink-2); font-weight: 600; }
.vocab-ex { margin: 6px 0 0; font-size: 10.5px; line-height: 1.55; color: var(--muted); }
.vocab-ex b { color: var(--ink-2); font-weight: 500; }
.vocab-actions { display: flex; gap: 5px; margin-top: 8px; }
.mini-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 23px;
  padding: 0 7px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  font-size: 8.5px;
}
.mini-btn:hover { background: var(--surface-2); color: var(--ink); }
.mini-btn svg { width: 11px; height: 11px; }
.mini-btn.on { color: var(--gold); border-color: rgba(181, 138, 63, 0.3); background: var(--gold-soft); }
.quiz-intro { padding: 8px 2px 12px; font-size: 10.5px; color: var(--muted); }
.quiz-q { padding: 13px 0; border-top: 1px solid var(--line); }
.quiz-q:first-of-type { border-top: 0; }
.quiz-number { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.12em; color: var(--accent); }
.quiz-text { margin: 5px 0 9px; font-size: 12px; line-height: 1.5; font-weight: 600; }
.quiz-options { display: flex; flex-direction: column; gap: 5px; }
.quiz-option {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: transparent;
  color: var(--ink-2);
  font-size: 10.5px;
  text-align: left;
  transition: background 0.15s, border-color 0.15s;
}
.quiz-option:hover { background: var(--surface-2); }
.quiz-option .letter { font-family: var(--font-mono); font-size: 8px; color: var(--faint); }
.quiz-option.correct { border-color: rgba(29, 89, 72, 0.35); background: var(--green-soft); color: var(--green); }
.quiz-option.wrong { border-color: rgba(210, 75, 43, 0.3); background: var(--accent-soft); color: var(--accent-deep); }
.quiz-option[disabled] { cursor: default; }
.quiz-explain { margin: 7px 0 0; padding: 7px 9px; border-left: 2px solid var(--gold); background: var(--gold-soft); font-size: 9.5px; line-height: 1.55; color: #6f531f; }
.quiz-score { display: flex; align-items: center; gap: 8px; padding: 9px 11px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); font-size: 10px; }
.quiz-score strong { font-family: var(--font-display); font-size: 20px; font-weight: 500; }
.note-wrap { padding: 6px 2px 0; }
.note-prompt { margin: 0 0 10px; padding-left: 10px; border-left: 2px solid var(--line-strong); font-size: 10px; line-height: 1.6; color: var(--muted); }
.note-area {
  width: 100%;
  min-height: 210px;
  resize: vertical;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 253, 247, 0.65);
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink-2);
}
.note-area:focus { border-color: var(--line-strong); outline: none; box-shadow: 0 0 0 3px rgba(210, 75, 43, 0.06); }
.note-meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 8.5px; color: var(--faint); }

/* ============================== Library ============================== */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
.page-head h1 { margin: 5px 0 0; font-family: var(--font-display); font-size: clamp(34px, 4vw, 48px); font-weight: 500; letter-spacing: -0.035em; line-height: 1; }
.page-head p { margin: 8px 0 0; max-width: 580px; font-size: 12px; line-height: 1.65; color: var(--muted); }
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  width: min(320px, 100%);
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.search-box svg { width: 15px; height: 15px; color: var(--faint); flex: 0 0 auto; }
.search-box input { width: 100%; height: 100%; min-width: 0; border: 0; background: transparent; font-size: 11.5px; outline: none; }
.search-box input::placeholder { color: var(--faint); }
.filter-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.filter-btn {
  height: 30px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 600;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.filter-btn:hover { background: var(--surface); }
.filter-btn.active { background: var(--ink); color: #fbf7ee; border-color: var(--ink); }
.library-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.ep-card {
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: var(--radius-lg);
  transition: transform 0.25s var(--ease), box-shadow 0.25s;
}
.ep-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.ep-cover {
  position: relative;
  aspect-ratio: 16 / 8.2;
  overflow: hidden;
  padding: 16px;
  color: #fbf5e8;
  background: linear-gradient(135deg, var(--c-a), var(--c-b));
}
.ep-cover[data-theme="ember"] { --c-a: #2a1712; --c-b: #8a361f; --c-glow: #ff9b73; }
.ep-cover[data-theme="steel"] { --c-a: #121b21; --c-b: #3a6272; --c-glow: #8ed4e5; }
.ep-cover[data-theme="forest"] { --c-a: #101d17; --c-b: #2e7154; --c-glow: #9cdbb5; }
.ep-cover[data-theme="ocean"] { --c-a: #0d1925; --c-b: #23658a; --c-glow: #8dd0ee; }
.ep-cover[data-theme="violet"] { --c-a: #1a1423; --c-b: #5a3d7c; --c-glow: #d0b0f5; }
.ep-cover::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(260px 180px at 85% 15%, color-mix(in srgb, var(--c-glow) 44%, transparent), transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,0.045) 23px 24px);
}
.ep-cover .cover-top { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; }
.ep-cover .cover-date { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.14em; color: rgba(251,245,232,0.65); }
.ep-cover .cover-no { font-family: var(--font-display); font-size: 44px; line-height: 0.8; color: rgba(251,245,232,0.22); letter-spacing: -0.06em; }
.ep-cover h3 { position: relative; z-index: 1; margin: 26px 0 0; font-family: var(--font-display); font-size: 25px; line-height: 1.02; font-weight: 500; letter-spacing: -0.025em; max-width: 220px; }
.ep-cover .cover-type { position: absolute; right: 14px; bottom: 12px; z-index: 1; display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 7.5px; letter-spacing: 0.08em; color: rgba(251,245,232,0.65); }
.ep-body { display: flex; flex-direction: column; flex: 1; padding: 15px 16px 16px; }
.ep-zh { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.5; }
.ep-body h4 { margin: 7px 0 0; font-family: var(--font-display); font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
.ep-summary { margin: 8px 0 0; font-size: 10px; line-height: 1.6; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ep-meta { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 13px; font-family: var(--font-mono); font-size: 8px; color: var(--faint); }
.ep-meta .bar { flex: 1; height: 3px; border-radius: 3px; background: var(--bg-deep); overflow: hidden; }
.ep-meta .bar span { display: block; height: 100%; background: var(--accent); }
.ep-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.ep-actions .btn { flex: 1; }
.source-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 28px; }
.source-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(251, 248, 241, 0.55);
  transition: background 0.2s, border-color 0.2s;
}
.source-link:hover { background: var(--surface); border-color: var(--line-strong); }
.source-mark {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 9px;
  background: var(--ink);
  color: #fbf7ee;
  font-family: var(--font-display);
  font-size: 14px;
  flex: 0 0 auto;
}
.source-link strong { display: block; font-size: 11px; }
.source-link > span:nth-child(2) { display: block; min-width: 0; }
.source-link > span:nth-child(2) > span { display: block; margin-top: 2px; font-size: 8.5px; color: var(--muted); }
.source-link svg { width: 14px; height: 14px; margin-left: auto; color: var(--faint); }
.empty-state { grid-column: 1 / -1; padding: 60px 20px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); color: var(--muted); }
.empty-state strong { display: block; font-family: var(--font-display); font-size: 24px; color: var(--ink); margin-bottom: 5px; }

/* ============================== Progress ============================== */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.stat-card { position: relative; padding: 18px; overflow: hidden; }
.stat-card .stat-label { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.13em; color: var(--faint); }
.stat-card .stat-value { margin-top: 8px; font-family: var(--font-display); font-size: 40px; line-height: 1; letter-spacing: -0.04em; }
.stat-card .stat-value small { font-family: var(--font-ui); font-size: 11px; color: var(--muted); letter-spacing: 0; }
.stat-card .stat-foot { margin-top: 8px; font-size: 9px; color: var(--muted); }
.stat-card.accent { background: var(--ink); color: #fbf7ee; }
.stat-card.accent .stat-label, .stat-card.accent .stat-value small, .stat-card.accent .stat-foot { color: rgba(251, 247, 238, 0.55); }
.stat-card.accent::after { content: ""; position: absolute; width: 120px; height: 120px; right: -40px; top: -40px; border-radius: 50%; border: 1px solid rgba(251, 247, 238, 0.12); }
.heat-card { padding: 22px; margin-top: 18px; }
.heat-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.heat-head h3 { margin: 4px 0 0; font-family: var(--font-display); font-size: 23px; font-weight: 500; }
.heat-legend { display: flex; align-items: center; gap: 5px; font-size: 8.5px; color: var(--faint); }
.heat-legend i { width: 9px; height: 9px; border-radius: 2px; background: var(--bg-deep); }
.heat-legend i:nth-child(2) { background: #efc2b2; }
.heat-legend i:nth-child(3) { background: #e39179; }
.heat-legend i:nth-child(4) { background: var(--accent); }
.heat-grid { display: grid; grid-template-columns: repeat(28, 1fr); gap: 5px; margin-top: 18px; }
.heat-cell {
  aspect-ratio: 1;
  border-radius: 4px;
  background: var(--bg-deep);
  position: relative;
  transition: transform 0.15s;
}
.heat-cell:hover { transform: scale(1.15); }
.heat-cell.l1 { background: #efc2b2; }
.heat-cell.l2 { background: #e39179; }
.heat-cell.l3 { background: var(--accent); }
.heat-cell.today { box-shadow: 0 0 0 2px var(--ink); }
.heat-labels { display: flex; justify-content: space-between; margin-top: 7px; font-family: var(--font-mono); font-size: 8px; color: var(--faint); }
.progress-two { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 18px; margin-top: 18px; }
.record-list { display: flex; flex-direction: column; }
.record-row { display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.record-row:first-child { border-top: 0; }
.record-date { font-family: var(--font-mono); font-size: 9px; color: var(--muted); }
.record-main strong { display: block; font-size: 11.5px; }
.record-main span { display: block; margin-top: 2px; font-size: 9px; color: var(--muted); }
.record-badge { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--green-soft); color: var(--green); }
.record-badge svg { width: 12px; height: 12px; }
.badge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 12px; }
.badge {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  opacity: 0.45;
}
.badge.on { opacity: 1; background: var(--surface-2); }
.badge-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--gold-soft); color: var(--gold); flex: 0 0 auto; }
.badge-icon svg { width: 15px; height: 15px; }
.badge strong { display: block; font-size: 10px; }
.badge span { display: block; margin-top: 1px; font-size: 8px; color: var(--muted); }
.skill-list { margin-top: 12px; display: flex; flex-direction: column; gap: 11px; }
.skill-row { display: flex; align-items: center; gap: 9px; }
.skill-row span { width: 66px; font-size: 9.5px; color: var(--muted); }
.skill-track { flex: 1; height: 6px; border-radius: 6px; background: var(--bg-deep); overflow: hidden; }
.skill-track i { display: block; height: 100%; border-radius: 6px; background: var(--green); }
.skill-row b { width: 28px; text-align: right; font-family: var(--font-mono); font-size: 8px; color: var(--muted); }

/* ============================== Settings ============================== */
.settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.settings-card { padding: 22px; }
.settings-card h3 { margin: 3px 0 3px; font-family: var(--font-display); font-size: 23px; font-weight: 500; letter-spacing: -0.02em; }
.settings-card > p { margin: 0 0 16px; font-size: 10.5px; line-height: 1.6; color: var(--muted); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 13px 0; border-top: 1px solid var(--line); }
.set-row:first-of-type { border-top: 0; }
.set-copy strong { display: block; font-size: 11.5px; }
.set-copy span { display: block; margin-top: 3px; font-size: 9.5px; color: var(--muted); line-height: 1.5; }
.set-control { flex: 0 0 auto; }
.select {
  height: 34px;
  padding: 0 28px 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  font-size: 10.5px;
  color: var(--ink-2);
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 13px) 14px, calc(100% - 9px) 14px;
  background-size: 4px 4px;
  background-repeat: no-repeat;
}
.input-time {
  height: 34px;
  padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 11px;
}
.switch { position: relative; display: inline-block; width: 38px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 22px; background: var(--bg-deep); transition: background 0.2s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform 0.2s var(--ease); }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { transform: translateX(16px); }
.range-row { display: flex; align-items: center; gap: 9px; }
.range-row input[type="range"] { width: 110px; accent-color: var(--accent); }
.range-row b { width: 32px; font-family: var(--font-mono); font-size: 9px; color: var(--muted); text-align: right; }
.data-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
.danger { color: var(--accent-deep); border-color: rgba(210,75,43,.25); }
.danger:hover { background: var(--accent-soft); }
.about-box { padding: 18px; border-radius: 14px; background: var(--ink); color: #f8f1e3; }
.about-box h4 { margin: 0 0 6px; font-family: var(--font-display); font-size: 19px; font-weight: 500; }
.about-box p { margin: 0; font-size: 9.5px; line-height: 1.7; color: rgba(248, 241, 227, 0.6); }
.about-box a { color: #ffb59d; text-decoration: underline; text-underline-offset: 2px; }
.reminder-box { margin-top: 14px; padding: 13px; border: 1px dashed var(--line-strong); border-radius: 11px; background: var(--surface-2); }
.reminder-box p { margin: 0 0 8px; font-size: 9.5px; line-height: 1.6; color: var(--muted); }
.reminder-box strong { color: var(--ink-2); }

/* ============================== Focus overlay ============================== */
.focus-layer {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(25, 24, 19, 0.58);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  animation: fade-in 0.25s var(--ease);
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.focus-card {
  width: min(930px, 100%);
  max-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 24px;
  background: var(--surface);
  box-shadow: 0 40px 100px -30px rgba(0, 0, 0, 0.6);
  animation: rise-in 0.3s var(--ease);
}
@keyframes rise-in { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: none; } }
.focus-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 22px 26px 16px; }
.focus-head h2 { margin: 4px 0 0; font-family: var(--font-display); font-size: 29px; font-weight: 500; letter-spacing: -0.03em; }
.focus-head-right { display: flex; align-items: center; gap: 16px; }
.focus-total { text-align: right; }
.focus-total span { display: block; font-family: var(--font-mono); font-size: 19px; letter-spacing: 0.02em; }
.focus-total small { display: block; margin-top: 2px; font-size: 8px; letter-spacing: 0.1em; color: var(--faint); }
.focus-progress { height: 3px; background: var(--bg-deep); }
.focus-progress span { display: block; height: 100%; background: var(--accent); transition: width 0.5s var(--ease); }
.focus-body { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 0; flex: 1; }
.focus-steps { padding: 18px 14px; border-right: 1px solid var(--line); background: var(--surface-2); overflow-y: auto; }
.focus-step {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 9px;
  border-radius: 9px;
  color: var(--muted);
  font-size: 10.5px;
}
.focus-step + .focus-step { margin-top: 3px; }
.focus-step .n {
  width: 21px; height: 21px;
  display: grid; place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  font-family: var(--font-mono);
  font-size: 8px;
  flex: 0 0 auto;
}
.focus-step.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(40,30,15,.07); }
.focus-step.active .n { background: var(--accent); border-color: var(--accent); color: #fff; }
.focus-step.done { color: var(--green); }
.focus-step.done .n { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.focus-step b { display: block; font-size: 10.5px; font-weight: 600; }
.focus-step span { display: block; margin-top: 1px; font-size: 8px; color: var(--faint); }
.focus-step .dur { margin-left: auto; font-family: var(--font-mono); font-size: 7.5px; color: var(--faint); }
.focus-main { padding: 26px 30px; overflow-y: auto; display: flex; flex-direction: column; }
.focus-kicker { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.15em; color: var(--accent); }
.focus-main h3 { margin: 8px 0 0; font-family: var(--font-display); font-size: 33px; line-height: 1.08; font-weight: 500; letter-spacing: -0.03em; max-width: 540px; }
.focus-desc { margin: 11px 0 0; max-width: 520px; font-size: 11.5px; line-height: 1.7; color: var(--muted); }
.focus-timer-wrap { display: flex; align-items: center; gap: 24px; margin-top: 22px; }
.focus-timer {
  font-family: var(--font-mono);
  font-size: 58px;
  line-height: 1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.focus-timer small { display: block; margin-top: 5px; font-family: var(--font-ui); font-size: 8px; letter-spacing: 0.14em; color: var(--faint); }
.focus-timer-actions { display: flex; gap: 6px; }
.focus-panel { margin-top: 22px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 253, 247, 0.55); }
.focus-panel .eyebrow { font-size: 8px; }
.focus-sentence-en { margin: 7px 0 0; font-family: var(--font-display); font-size: 17px; line-height: 1.45; }
.focus-sentence-zh { margin: 5px 0 0; font-size: 11px; line-height: 1.6; color: var(--muted); }
.focus-prompts { margin: 8px 0 0; padding-left: 18px; font-size: 11px; line-height: 1.8; color: var(--muted); }
.focus-textarea {
  width: 100%;
  min-height: 76px;
  margin-top: 10px;
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(255, 253, 247, 0.65);
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.6;
  resize: vertical;
}
.focus-textarea:focus { outline: none; border-color: var(--line-strong); box-shadow: 0 0 0 3px rgba(210, 75, 43, 0.06); }
.vocab-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
#focus-audio { width: 100%; height: 36px; margin-top: 10px; }
.focus-main.sub-en .focus-sentence-zh,
.focus-main.sub-zh .focus-sentence-en,
.focus-main.sub-none .focus-sentence-en,
.focus-main.sub-none .focus-sentence-zh { display: none; }
.focus-main.sub-en .focus-panel .focus-sentence-en { font-size: 19px; }
.focus-main.sub-none .focus-panel { min-height: 110px; }
.focus-recorder { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 12px; }
.record-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.3s infinite; }
.recording-note { font-size: 9px; color: var(--muted); }
.focus-foot { display: flex; align-items: center; gap: 14px; padding: 14px 26px; border-top: 1px solid var(--line); background: var(--surface); }
.focus-hint { flex: 1; text-align: center; font-size: 9.5px; color: var(--faint); }
.focus-foot .btn { min-width: 120px; }

/* ============================== Modal / toast / confetti ============================== */
.modal-layer {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(25, 24, 19, 0.5);
  backdrop-filter: blur(6px);
}
.modal-card {
  width: min(460px, 100%);
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  padding: 26px;
  border-radius: 18px;

  const escapeHTML = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({

  const icon = (name, cls = '') => '<svg' + (cls ? ' class="' + cls + '"' : '') + ' aria-hidden="true"><use href="#i-' + name + '"/></svg>';

  function defaultState() {

  function loadState() {

        settings: Object.assign({}, fallback.settings, parsed.settings || {}),
        history: parsed.history || {},
        progress: parsed.progress || {},

      });
    } catch (err) {

    }
  }

  let state = loadState();
  let currentEpisode = null;
  let media = null;
  let activeIndex = -1;
  let activeCueIndex = -1;
  let destroyingMedia = false;
  let noteTimer = null;
  let searchTimer = null;

  const ui = {
    view: 'today',

    tab: 'lines',
    subtitleMode: state.settings.defaultSubtitle || 'both',
    mediaMode: 'video',
    search: '',
    filter: 'all',
    fullMode: false,
    loopSegment: false,
    clipEnded: false,
    speed: 1,
    focusStep: 0,
    focusRemaining: 0,
    focusRunning: false,
    focusTimer: null,
    focusVisited: new Set(),
    focusNote: '',
    focusAudioUrl: null,
    recording: null,
    recordingTimer: null
  };

  function parseDate(str) {
    const parts = String(str).split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function localDate(d = new Date()) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function addDays(dateStr, amount) {
    const d = parseDate(dateStr);
    d.setDate(d.getDate() + amount);
    return localDate(d);
  }

  function dateCn(dateStr) {
    const d = parseDate(dateStr);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function weekdayCn(dateStr) {
    return ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][parseDate(dateStr).getDay()];
  }

  function todayStr() {
    return localDate(new Date());
  }

  function dayNumber() {
    const start = parseDate('2026-10-31');
    const now = parseDate(todayStr());
    return Math.max(1, Math.floor((now - start) / DAY_MS) + 1);
  }

  function formatTime(seconds) {
    if (!isFinite(seconds) || seconds < 0) seconds = 0;
    const total = Math.floor(seconds);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
  }

  function formatDuration(seconds) {
    const mins = Math.max(1, Math.round(seconds / 60));
    return mins + ' 分钟';
  }

  function formatMinutes(seconds) {
    return Math.max(1, Math.round(seconds / 60));
  }

  function shorten(text, max) {
    const value = String(text || '').trim();
    if (value.length <= max) return value;
    const cut = value.slice(0, max);
    const space = cut.lastIndexOf(' ');
    return (space > max * 0.55 ? cut.slice(0, space) : cut).replace(/[.,;:!?，。；：！？]+$/, '') + '…';
  }

  function splitSentences(text, locale) {
    const value = String(text || '').replace(/\s+/g, ' ').trim();
    if (!value) return [];
    try {
      if (typeof Intl !== 'undefined' && Intl.Segmenter) {
        const segmenter = new Intl.Segmenter(locale || 'en', { granularity: 'sentence' });
        const parts = Array.from(segmenter.segment(value), (item) => item.segment.trim()).filter(Boolean);
        if (parts.length) return parts;
      }
    } catch (err) { /* fall through */ }
    const parts = value.match(/[^.!?。！？]+[.!?。！？]+["'”’]?|[^.!?。！？]+$/g) || [value];
    return parts.map((s) => s.trim()).filter(Boolean);
  }

  function groupParts(parts, count) {
    if (count <= 0) return [];
    if (parts.length === count) return parts.slice();
    if (parts.length < count) {
      const out = parts.slice();
      while (out.length < count) out.push(out[out.length - 1] || '');
      return out;
    }
    const out = [];
    let cursor = 0;
    for (let i = 0; i < count; i += 1) {
      const end = i === count - 1 ? parts.length : Math.max(cursor + 1, Math.round(((i + 1) / count) * parts.length));
      out.push(parts.slice(cursor, end).join(''));
      cursor = end;
    }
    return out;
  }

  function alignChinese(parts, count) {
    if (parts.length === count) return parts.slice();
    if (parts.length > count) return groupParts(parts, count);
    const clauses = [];
    parts.forEach((part) => {
      const pieces = part.split(/(?<=[，；：,;])\s*/).filter(Boolean);
      if (pieces.length) clauses.push(...pieces);
      else clauses.push(part);
    });
    if (clauses.length >= count) return groupParts(clauses, count);
    const out = clauses.slice();
    while (out.length < count) out.push('');
    return out;
  }

  function buildSentenceCues(ep) {
    if (!ep) return [];
    if (ep._sentenceCues) return ep._sentenceCues;
    const supplied = window.SUBTITLE_CUES && window.SUBTITLE_CUES[ep.id];
    if (Array.isArray(supplied) && supplied.length) {
      // Cues are cut from the original VTT, so their starts match the audio.
      // A tiny lead-in avoids the “subtitle arrives after the voice” feeling.
      ep._sentenceCues = supplied.map((cue, index) => Object.assign({}, cue, {
        start: Math.max(0, Number(cue.start) - 0.12),
        end: Number(cue.end) + 0.05,
        sentenceIndex: index
      }));
      return ep._sentenceCues;
    }
    const cues = [];
    ep.segments.forEach((seg, segIndex) => {
      const ens = splitSentences(seg.en, 'en');
      const english = ens.length ? ens : [seg.en];
      const chinese = alignChinese(splitSentences(seg.zh, 'zh'), english.length);
      const weights = english.map((sentence) => {
        const words = sentence.match(/[A-Za-z0-9'’-]+/g);
        return Math.max(3, words ? words.length : 3);
      });
      const totalWeight = weights.reduce((sum, n) => sum + n, 0);
      let passed = 0;
      const span = Math.max(1, seg.end - seg.start);
      english.forEach((sentence, i) => {
        const start = seg.start + (passed / totalWeight) * span;
        passed += weights[i];
        const end = i === english.length - 1 ? seg.end : seg.start + (passed / totalWeight) * span;
        cues.push({
          start,
          end: Math.max(start + 0.4, end),
          en: sentence,
          zh: chinese[i] || '',
          segIndex,
          sentenceIndex: i,
          section: seg.section
        });
      });
    });
    ep._sentenceCues = cues;
    return cues;
  }

  function currentCues() {
    return currentEpisode ? buildSentenceCues(currentEpisode) : [];

  function getEpisode(id) {

  function episodeForToday() {
    const sorted = EPISODES.slice().sort((a, b) => b.date.localeCompare(a.date));

    return available[0] || sorted[sorted.length - 1] || null;
  }

  function activeEpisode() {
    return getEpisode(ui.episodeId) || episodeForToday();
  }

  function ensureProgress(episodeId) {
    if (!state.progress[episodeId]) {
      state.progress[episodeId] = { mastered: [], note: '', quiz: {}, lastTime: 0, lastPlayed: 0 };
    }
    const p = state.progress[episodeId];
    if (!Array.isArray(p.mastered)) p.mastered = [];
    if (!p.quiz || typeof p.quiz !== 'object') p.quiz = {};
    return p;
  }

  function saveState() {

    }

  function getDayRecord(date = todayStr()) {
    return state.history[date] || { tasks: [], completed: false, minutes: 0, episodeId: null };
  }

  function isComplete(date) {
    return !!(state.history[date] && state.history[date].completed);
  }

  function computeStreak() {
    let cursor = new Date();
    if (!isComplete(localDate(cursor))) cursor.setDate(cursor.getDate() - 1);
    let streak = 0;
    while (isComplete(localDate(cursor))) {
      streak += 1;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function longestStreak() {
    const dates = Object.keys(state.history).filter((d) => state.history[d].completed).sort();
    let best = 0;
    let run = 0;
    let previous = null;
    dates.forEach((date) => {
      if (previous && addDays(previous, 1) === date) run += 1;
      else run = 1;
      best = Math.max(best, run);
      previous = date;
    });
    return best;
  }

  function totalMinutes() {
